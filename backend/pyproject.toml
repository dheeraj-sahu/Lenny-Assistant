[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-assistant-backend"
version = "0.1.0"
description = "Backend for The Lenny Growth Assistant — FastAPI + Claude Agent SDK + Qdrant RAG"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Pydantic v2
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Anthropic Claude Agent SDK
    "anthropic>=0.28.0",

    # Database / ORM
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Vector database client
    "qdrant-client>=1.9.0",

    # Embeddings (local, CPU-only)
    "sentence-transformers>=3.0.0",

    # Git operations for ingestion
    "gitpython>=3.1.43",

    # HTML sanitization
    "nh3>=0.2.17",
    "bleach>=6.1.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
